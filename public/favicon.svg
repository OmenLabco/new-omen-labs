<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon (flat-top, radius 44) -->
  <polygon
    points="88.1,27 88.1,73 50,96 11.9,73 11.9,27 50,4"
    stroke="#0047FF"
    stroke-width="6"
    fill="none"
    stroke-linejoin="round"
  />
  <!-- Inner double-bond lines (alternating sides benzene style, inner radius ~31.7) -->
  <!-- Side 0-1 -->
  <line x1="77.5" y1="31.7" x2="77.5" y2="68.3" stroke="#0047FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Side 2-3 -->
  <line x1="50" y1="81.7" x2="22.5" y2="68.3" stroke="#0047FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Side 4-5 -->
  <line x1="22.5" y1="31.7" x2="50" y2="18.3" stroke="#0047FF" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#0047FF"/>
</svg>
